# Builds Tuney in GitHub Actions and attaches its zip to a DRAFT release (tools pinned to one mpc-vst-plugins commit,
# in both places). Install that zip on an MPC, test it, then publish the draft.
#   Actions -> Release -> Run workflow: version
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 1.4.2
        type: string
        required: true
      dry_run:
        description: Build and package only (zip and previews as run artifacts), no draft release
        type: boolean
        default: false

jobs:
  vst:
    uses: sd88me/mpc-vst-plugins/.github/workflows/vst-release.yml@8aa8d3552a55a93eb4034bb9bbb02cbe91d69b61
    permissions: { contents: write }
    with:
      tag: tuney-vst-v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: 8aa8d3552a55a93eb4034bb9bbb02cbe91d69b61
      vst_dir: vst
      build: '"$MPC_VST/tools/build_port.sh" vst/vst.json'
      host_test: '"$MPC_VST/tools/test_port.sh" vst/vst.json'
      about: Real-time vocal pitch correction with a touch keyboard, a pitch dial and natural-sounding transitions.
      plugin_id: tuney
      license: MIT
      dry_run: ${{ inputs.dry_run }}
